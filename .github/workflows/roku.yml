name: Update Roku playlist

on:
  schedule:
    - cron: "0 */4 * * *"   # every 4 hours (UTC)
  workflow_dispatch:         # allow manual runs

permissions:
  contents: write

concurrency:
  group: roku-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"   # latest stable Python
          cache: pip
          cache-dependency-path: roku_playlist.py

      - name: Install dependencies
        run: pip install requests

      - name: Generate playlist and EPG
        run: python roku_playlist.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlists/roku_all.m3u playlists/roku_all.xml.gz
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Roku playlist $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
